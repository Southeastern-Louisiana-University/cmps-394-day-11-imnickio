name: Backend Build and Test

on:
  push:
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t backend-app .

      - name: Run Container
        run: docker run -d -p 8082:8080 --name backend-test backend-app

      - name: Verify Service
        run: |
          sleep 5

          RESPONSE=$(curl -s localhost:8082)
          if [[ "$RESPONSE" == *"Hello, World from Go backend!"* ]]; then
            echo "Backend is healthy"
          else
            echo "Unexpected response: $RESPONSE"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f backend-test
